<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Looper">
<meta name="mobile-web-app-capable" content="yes">
<title>Looper Multitrack - Paisagem</title>
<style>
  :root{
    --bg:#0f1115; --card:#1a1d24; --card2:#22262f; --text:#eef0f4; --muted:#9aa1af;
    --accent:#ff5470; --accent2:#4f8cff; --ok:#3ecf8e; --border:#2b2f3a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none; width: 100vw; height: 100vh; overflow: hidden;
  }

  /* FORÇAR ROTAÇÃO FÍSICA PARA MODO PAISAGEM SE O CELULAR ESTIVER EM PÉ */
  @media screen and (orientation: portrait) {
    body {
      position: absolute;
      width: 100vh !important;
      height: 100vw !important;
      transform: rotate(90deg);
      transform-origin: top left;
      top: 0;
      left: 100vw;
    }
  }

  body {
    padding: 4px 8px; display: flex; flex-direction: column; gap: 4px;
  }

  /* Topo Super Compacto */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    background: var(--card); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border);
    flex-shrink: 0;
  }
  h1 { font-size: 12px; margin: 0; font-weight: 700; display: flex; align-items: center; gap: 2px; }

  .transport-bar { display: flex; align-items: center; gap: 4px; width: 100%; justify-content: space-between; }
  .mic-select-row { display: flex; align-items: center; gap: 2px; }
  .mic-select-row select { padding: 2px 4px; border-radius: 4px; border: 1px solid var(--border); background: var(--card2); color: var(--text); font-size: 10px; max-width: 100px; }
  .mic-refresh-btn { padding: 2px 4px; border-radius: 4px; border: 1px solid var(--border); background: var(--card2); color: var(--text); font-size: 10px; cursor: pointer; }

  .rec-btn {
    padding: 3px 8px; border-radius: 12px; border: none; background: var(--accent); color: #fff;
    font-size: 10px; font-weight: 700; display: flex; align-items: center; gap: 3px; cursor: pointer; flex-shrink: 0;
  }
  .rec-btn.recording { background: #b8102f; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(184,16,47,.4);} 70%{box-shadow:0 0 0 6px rgba(184,16,47,0);} 100%{box-shadow:0 0 0 0 rgba(184,16,47,0);} }
  
  .timer { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--muted); font-weight: 600; }

  .btn-group { display: flex; gap: 2px; }
  .btn-group button {
    padding: 3px 6px; border-radius: 4px; border: 1px solid var(--border);
    background: var(--card2); color: var(--text); font-size: 10px; font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn-group button.primary { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  .btn-group button.ok { border-color: var(--ok); color: var(--ok); }

  /* Área Principal das Pistas */
  .tracks-container { position: relative; width: 100%; flex: 1; overflow-y: auto; overflow-x: hidden; }
  .tracks { display: flex; flex-direction: column; gap: 2px; background: var(--border); border-radius: 6px; padding: 2px; border: 1px solid var(--border); }

  .playhead-line {
    position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent2);
    z-index: 10; pointer-events: none; display: none; transform: translateX(0);
    box-shadow: 0 0 6px rgba(79,140,255,0.8);
  }
  .playhead-line.recording-line { background: var(--accent); box-shadow: 0 0 6px rgba(255,84,112,0.8); }

  /* Pistas Ajustadas para 68px de Altura */
  .track {
    display: grid; grid-template-columns: 210px 1fr; background: var(--card);
    border-radius: 4px; overflow: hidden; height: 68px;
  }

  .track-controls {
    padding: 4px 6px; background: var(--card2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; justify-content: space-between;
  }

  .track-top { display: flex; align-items: center; justify-content: space-between; gap: 2px; }
  .track-name { font-weight: 600; font-size: 10.5px; display: flex; align-items: center; gap: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dot { width: 5px; height: 5px; border-radius: 50%; background: #555; flex-shrink: 0; }
  .dot.active { background: var(--ok); }
  .track-actions { display: flex; gap: 2px; }
  .icon-btn {
    width: 20px; height: 20px; border-radius: 3px; border: 1px solid var(--border);
    background: var(--card); color: var(--text); display: flex; align-items: center; justify-content: center;
    font-size: 9.5px; cursor: pointer; padding: 0;
  }
  .icon-btn.mute-active { background: #5a5f6a; border-color: #5a5f6a; }

  .controls-grid { display: flex; flex-direction: column; gap: 2px; }
  .vol-row, .pan-row { display: flex; align-items: center; gap: 3px; font-size: 9px; line-height: 1; }
  .vol-row input, .pan-row input { flex: 1; accent-color: var(--accent2); height: 12px; margin: 0; }
  .val-label { color: var(--muted); font-size: 8.5px; width: 24px; text-align: right; }

  .nudge-row { display: flex; align-items: center; justify-content: space-between; gap: 2px; font-size: 8.5px; background: var(--card); padding: 2px 4px; border-radius: 3px; }
  .nudge-controls { display: flex; gap: 2px; }
  .nudge-btn { padding: 1px 4px; border-radius: 2px; border: 1px solid var(--border); background: var(--card2); color: var(--text); font-size: 8.5px; cursor: pointer; height: 16px; line-height: 1; }
  .nudge-val { width: 34px; text-align: center; background: var(--card2); border: 1px solid var(--border); border-radius: 2px; color: var(--text); font-size: 8.5px; padding: 0; height: 16px; }

  /* Área da Onda (Encostada na Direita) */
  .waveform-wrapper {
    width: 100%; height: 100%; background: #12141a; position: relative; overflow: hidden; display: flex; align-items: center;
  }
  .waveform-canvas { height: 100%; display: block; position: absolute; left: 0; top: 0; }

  .empty { text-align: center; color: var(--muted); font-size: 11px; padding: 12px; border: 1px dashed var(--border); border-radius: 6px; }

  .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--card); padding: 3px 8px; border-radius: 6px; border: 1px solid var(--border); font-size: 10px; flex-shrink: 0; }
  .settings-row input { accent-color: var(--accent2); flex: 1; max-width: 150px; height: 12px; }

  .status { position: fixed; left: 0; right: 0; bottom: 4px; text-align: center; font-size: 10px; color: var(--muted); pointer-events: none; z-index: 100; }
  .perm { background: var(--card2); border: 1px solid var(--border); border-radius: 6px; padding: 6px; font-size: 11px; color: var(--muted); text-align: center; }
  .perm button { margin-top: 4px; padding: 2px 8px; border-radius: 4px; border: none; background: var(--accent2); color: #fff; font-weight: 600; font-size: 10px; }
</style>
</head>
<body>

<header>
  <div class="transport-bar">
    <h1>🎙️ Looper</h1>
    <div class="mic-select-row">
      <select id="micSelect"><option value="">Mic Padrão</option></select>
      <button id="micRefreshBtn" class="mic-refresh-btn" title="Atualizar">🔄</button>
    </div>
    <button id="recBtn" class="rec-btn">⏺ <span id="recLabel">REC</span></button>
    <div class="timer" id="timer">00:00</div>
    
    <div class="btn-group">
      <button id="playAllBtn" class="primary">▶ Play</button>
      <button id="stopAllBtn">⏹ Parar</button>
    </div>

    <div class="btn-group">
      <button id="saveProjBtn">💾 Salvar</button>
      <button id="loadProjBtn">📂 Abrir</button>
      <input type="file" id="projFileInput" accept=".json" style="display:none;">
    </div>

    <div class="btn-group">
      <button id="exportBtn" class="ok">⬇️ Mix (.wav)</button>
      <button id="exportStemsBtn">⬇️ Stems</button>
    </div>
  </div>
</header>

<div id="permBox" class="perm" style="display:none;">
  Permissão de microfone necessária.
  <button id="permBtn">Permitir</button>
  <div id="permInstructions" style="margin-top:2px; font-size:10px; color:#ff9a9a;"></div>
</div>

<div class="tracks-container">
  <div id="playhead" class="playhead-line"></div>
  <div id="trackList" class="tracks"></div>
</div>

<div id="emptyMsg" class="empty">Nenhuma pista gravada. Toque em REC no topo.</div>

<div class="settings-row">
  <span>Latência: <strong id="offsetVal">0 ms</strong></span>
  <input type="range" id="offsetSlider" min="-1000" max="1000" value="0" step="10">
  <button id="calBtn" style="padding:2px 6px; border-radius:3px; border:1px solid var(--border); background:var(--card2); color:var(--text); font-size:9px; cursor:pointer;">🎧 Calibrar</button>
  <span id="calResult" style="color:var(--muted); font-size:9px;"></span>
</div>

<div class="status" id="statusMsg"></div>

<script>
(function(){
  let audioCtx = null;
  let mediaStream = null;
  let recorder = null;
  let chunks = [];
  let tracks = []; 
  let trackCounter = 0;
  let isRecording = false;
  let timerInterval = null;
  let recordStartWall = 0;
  let latencyOffsetMs = 0;
  let isPlayingAll = false;
  let animFrameId = null;
  let playStartCtxTime = 0;
  let maxProjectDuration = 0;

  const recBtn = document.getElementById('recBtn');
  const recLabel = document.getElementById('recLabel');
  const timerEl = document.getElementById('timer');
  const trackListEl = document.getElementById('trackList');
  const emptyMsg = document.getElementById('emptyMsg');
  const playAllBtn = document.getElementById('playAllBtn');
  const stopAllBtn = document.getElementById('stopAllBtn');
  const playhead = document.getElementById('playhead');
  const offsetSlider = document.getElementById('offsetSlider');
  const offsetVal = document.getElementById('offsetVal');
  const calBtn = document.getElementById('calBtn');
  const calResult = document.getElementById('calResult');
  const statusMsg = document.getElementById('statusMsg');
  const permBox = document.getElementById('permBox');
  const permBtn = document.getElementById('permBtn');
  const permInstructions = document.getElementById('permInstructions');
  const exportBtn = document.getElementById('exportBtn');
  const exportStemsBtn = document.getElementById('exportStemsBtn');
  const saveProjBtn = document.getElementById('saveProjBtn');
  const loadProjBtn = document.getElementById('loadProjBtn');
  const projFileInput = document.getElementById('projFileInput');
  const micSelect = document.getElementById('micSelect');
  const micRefreshBtn = document.getElementById('micRefreshBtn');
  let selectedMicId = '';

  function setStatus(msg, timeout){
    statusMsg.textContent = msg;
    if(timeout){
      setTimeout(()=>{ if(statusMsg.textContent === msg) statusMsg.textContent=''; }, timeout);
    }
  }

  function fmtTime(sec){
    sec = Math.max(0, Math.floor(sec));
    const m = String(Math.floor(sec/60)).padStart(2,'0');
    const s = String(sec%60).padStart(2,'0');
    return m+':'+s;
  }

  async function ensureAudioContext(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    }
    if(audioCtx.state === 'suspended') await audioCtx.resume();
    try {
      if (audioCtx.destination.maxChannelCount >= 2) {
        audioCtx.destination.channelCount = 2;
        audioCtx.destination.channelCountMode = 'explicit';
        audioCtx.destination.channelInterpretation = 'speakers';
      }
    } catch(e){}
    return audioCtx;
  }

  async function ensureMic(){
    if(mediaStream) return mediaStream;
    try{
      const audioConstraints = { 
        echoCancellation: false, noiseSuppression: false, autoGainControl: false,
        channelCount: 1, sampleRate: 48000
      };
      if(selectedMicId) audioConstraints.deviceId = { exact: selectedMicId };
      mediaStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
      permBox.style.display = 'none';
      refreshMicList();
      return mediaStream;
    }catch(err){
      permBox.style.display = 'block';
      permInstructions.textContent = 'Erro ao acessar microfone: ' + (err.message || err);
      throw err;
    }
  }

  function releaseMic(){
    if(mediaStream){
      mediaStream.getTracks().forEach(t=>{ try{ t.stop(); t.enabled = false; }catch(e){} });
      mediaStream = null;
    }
  }

  async function refreshMicList(){
    try{
      const devices = await navigator.mediaDevices.enumerateDevices();
      const mics = devices.filter(d => d.kind === 'audioinput');
      const prevValue = micSelect.value;
      micSelect.innerHTML = '<option value="">Mic Padrão</option>';
      mics.forEach((d, i)=>{
        const opt = document.createElement('option');
        opt.value = d.deviceId;
        opt.textContent = d.label || ('Mic ' + (i+1));
        micSelect.appendChild(opt);
      });
      if([...micSelect.options].some(o=>o.value === prevValue)) micSelect.value = prevValue;
    }catch(e){}
  }

  micSelect.addEventListener('change', ()=>{ selectedMicId = micSelect.value; releaseMic(); });
  micRefreshBtn.addEventListener('click', refreshMicList);
  permBtn.addEventListener('click', async ()=>{ await ensureMic(); });

  function createPanNode(ctx, panVal){
    const input = ctx.createGain();
    const gainL = ctx.createGain();
    const gainR = ctx.createGain();
    const merger = ctx.createChannelMerger(2);

    input.connect(gainL); input.connect(gainR);
    gainL.connect(merger, 0, 0); gainR.connect(merger, 0, 1);

    function applyPan(v){
      const angle = (v + 1) * 0.25 * Math.PI;
      gainL.gain.value = Math.cos(angle);
      gainR.gain.value = Math.sin(angle);
    }
    applyPan(panVal || 0);

    return { input, output: merger, set pan(v){ applyPan(v); } };
  }

  // ---------- Gravação ----------
  recBtn.addEventListener('click', ()=>{ isRecording ? stopRecording() : startRecording(); });

  async function startRecording(){
    try{
      await ensureAudioContext();
      const stream = await ensureMic();

      chunks = [];
      const options = { audioBitsPerSecond: 256000 };
      if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
        options.mimeType = 'audio/webm;codecs=opus';
      }

      recorder = new MediaRecorder(stream, options);
      recorder.ondataavailable = (e)=>{ if(e.data && e.data.size>0) chunks.push(e.data); };
      recorder.onstop = onRecordingStop;

      const recordStartCtxTime = audioCtx.currentTime + 0.05;
      playAllTracksFrom(recordStartCtxTime);

      recorder.start();
      isRecording = true;
      recordStartWall = performance.now();
      recBtn.classList.add('recording');
      recLabel.textContent = 'PARAR';

      playhead.style.display = 'block';
      playhead.classList.add('recording-line');
      
      timerInterval = setInterval(()=>{
        const elapsed = (performance.now()-recordStartWall)/1000;
        timerEl.textContent = fmtTime(elapsed);
        updateRecordingPlayhead(elapsed);
      }, 50);

      setStatus('Gravando...', null);
    }catch(err){
      console.error(err);
      isRecording = false;
      recBtn.classList.remove('recording');
      recLabel.textContent = 'REC';
    }
  }

  function stopRecording(){
    if(recorder && recorder.state !== 'inactive') recorder.stop();
    isRecording = false;
    recBtn.classList.remove('recording');
    recLabel.textContent = 'REC';
    clearInterval(timerInterval);
    stopAllPlayback();
    releaseMic();
    setStatus('Processando...', null);
  }

  async function onRecordingStop(){
    try{
      const blob = new Blob(chunks, {type: chunks[0]?.type || 'audio/webm'});
      const arrBuf = await blob.arrayBuffer();
      const audioBuffer = await audioCtx.decodeAudioData(arrBuf);

      const data = audioBuffer.getChannelData(0);
      let maxPeak = 0;
      for(let i=0; i<data.length; i++) {
        const abs = Math.abs(data[i]);
        if(abs > maxPeak) maxPeak = abs;
      }
      if(maxPeak > 0.85) {
        const factor = 0.85 / maxPeak;
        for(let ch=0; ch<audioBuffer.numberOfChannels; ch++) {
          const chData = audioBuffer.getChannelData(ch);
          for(let i=0; i<chData.length; i++) chData[i] *= factor;
        }
      }

      trackCounter++;
      const track = {
        id: 'trk'+trackCounter,
        name: 'Pista ' + trackCounter,
        buffer: audioBuffer,
        volume: 1, pan: 0,
        offsetMs: latencyOffsetMs,
        muted: false, playing: false
      };
      tracks.push(track);
      renderTracks();
      setStatus('Pista gravada!', 2000);
    }catch(err){
      console.error(err);
      setStatus('Erro ao processar gravação.', 3000);
    }
  }

  // ---------- Playback & Playhead ----------
  function calculateMaxDuration(){
    if(tracks.length === 0) return 0;
    return Math.max(...tracks.map(t => t.buffer.duration + (t.offsetMs/1000)));
  }

  function playTrack(track, when){
    if(track.muted) return;
    const offsetSec = track.offsetMs / 1000;
    let startAtCtxTime = when;
    let bufferOffsetSec = 0;

    if (offsetSec >= 0) {
      startAtCtxTime = when + offsetSec;
    } else {
      bufferOffsetSec = Math.abs(offsetSec);
      if (bufferOffsetSec >= track.buffer.duration) return;
    }

    const src = audioCtx.createBufferSource();
    src.buffer = track.buffer;

    const gain = audioCtx.createGain();
    gain.gain.value = track.volume;

    const pan = createPanNode(audioCtx, track.pan);
    src.connect(gain).connect(pan.input);
    pan.output.connect(audioCtx.destination);

    if (bufferOffsetSec > 0) {
      src.start(startAtCtxTime, bufferOffsetSec);
    } else {
      src.start(startAtCtxTime);
    }
    
    track.source = src; track.gainNode = gain; track.pannerNode = pan; track.playing = true;
    src.onended = ()=>{ track.playing = false; updateTrackDots(); };
  }

  function playAllTracksFrom(when){
    tracks.forEach(t => playTrack(t, when));
    updateTrackDots();
  }

  function stopAllPlayback(){
    tracks.forEach(t=>{
      if(t.source){ try{ t.source.stop(); t.source.disconnect(); }catch(e){} t.source = null; }
      t.playing = false;
    });
    isPlayingAll = false;
    if(animFrameId) cancelAnimationFrame(animFrameId);
    playhead.style.display = 'none';
    playhead.classList.remove('recording-line');
    updateTrackDots();
  }

  playAllBtn.addEventListener('click', async ()=>{
    if(tracks.length === 0) return;
    releaseMic();
    await ensureAudioContext();
    stopAllPlayback();

    maxProjectDuration = calculateMaxDuration();
    playStartCtxTime = audioCtx.currentTime + 0.05;
    playAllTracksFrom(playStartCtxTime);
    isPlayingAll = true;

    playhead.style.display = 'block';
    playhead.classList.remove('recording-line');
    updatePlaybackPlayhead();
  });

  stopAllBtn.addEventListener('click', stopAllPlayback);

  function updatePlaybackPlayhead(){
    if(!isPlayingAll) return;
    const elapsed = audioCtx.currentTime - playStartCtxTime;
    
    if(elapsed > maxProjectDuration){ stopAllPlayback(); return; }

    const pct = Math.min(1, elapsed / maxProjectDuration);
    const waveAreaWidth = trackListEl.clientWidth - 210;
    playhead.style.transform = `translateX(${210 + (pct * waveAreaWidth)}px)`;

    animFrameId = requestAnimationFrame(updatePlaybackPlayhead);
  }

  function updateRecordingPlayhead(elapsed){
    maxProjectDuration = Math.max(calculateMaxDuration(), elapsed);
    const pct = maxProjectDuration > 0 ? elapsed / maxProjectDuration : 0;
    const waveAreaWidth = trackListEl.clientWidth - 210;
    playhead.style.transform = `translateX(${210 + (pct * waveAreaWidth)}px)`;
  }

  // ---------- Interface Paisagem ----------
  function renderTracks(){
    trackListEl.innerHTML = '';
    emptyMsg.style.display = tracks.length ? 'none' : 'block';
    maxProjectDuration = calculateMaxDuration();

    tracks.forEach((track)=>{
      const el = document.createElement('div');
      el.className = 'track';
      const trackDur = track.buffer.duration;
      const widthPct = maxProjectDuration > 0 ? (trackDur / maxProjectDuration) * 100 : 100;

      el.innerHTML = `
        <div class="track-controls">
          <div class="track-top">
            <div class="track-name"><span class="dot" id="dot-${track.id}"></span>${track.name}</div>
            <div class="track-actions">
              <button class="icon-btn stem-one" title="WAV">⬇️</button>
              <button class="icon-btn mute-one ${track.muted ? 'mute-active' : ''}">${track.muted ? '🔇' : '🔊'}</button>
              <button class="icon-btn del del-one" style="color:#ff7b7b;">🗑</button>
            </div>
          </div>

          <div class="controls-grid">
            <div class="vol-row">
              <span>🔈</span>
              <input type="range" min="0" max="1.5" step="0.01" value="${track.volume}" class="vol-slider">
              <span class="val-label vol-val">${Math.round(track.volume*100)}%</span>
            </div>
            <div class="pan-row">
              <span style="font-size:8px; color:var(--muted);">PAN</span>
              <input type="range" min="-1" max="1" step="0.02" value="${track.pan}" class="pan-slider">
              <span class="val-label pan-val">${getPanLabel(track.pan)}</span>
            </div>
          </div>

          <div class="nudge-row">
            <div class="nudge-controls">
              <button class="nudge-btn nudge-m50">-50</button>
              <button class="nudge-btn nudge-m10">-10</button>
              <button class="nudge-btn nudge-p10">+10</button>
              <button class="nudge-btn nudge-p50">+50</button>
            </div>
            <input type="number" class="nudge-val" value="${track.offsetMs}">
          </div>
        </div>

        <div class="waveform-wrapper">
          <canvas class="waveform-canvas" id="canvas-${track.id}" style="width:${widthPct}%;"></canvas>
        </div>
      `;

      el.querySelector('.mute-one').addEventListener('click', ()=>{
        track.muted = !track.muted;
        if(track.gainNode) track.gainNode.gain.value = track.muted ? 0 : track.volume;
        renderTracks();
      });

      el.querySelector('.del-one').addEventListener('click', ()=>{
        if(track.source){ try{ track.source.stop(); }catch(e){} }
        tracks = tracks.filter(t=>t.id !== track.id);
        renderTracks();
      });

      el.querySelector('.stem-one').addEventListener('click', ()=> exportSingleTrack(track));

      el.querySelector('.vol-slider').addEventListener('input', (e)=>{
        track.volume = parseFloat(e.target.value);
        if(track.gainNode && !track.muted) track.gainNode.gain.value = track.volume;
        el.querySelector('.vol-val').textContent = Math.round(track.volume*100)+'%';
      });

      el.querySelector('.pan-slider').addEventListener('input', (e)=>{
        track.pan = parseFloat(e.target.value);
        if(track.pannerNode) track.pannerNode.pan = track.pan;
        el.querySelector('.pan-val').textContent = getPanLabel(track.pan);
      });

      const nudgeInput = el.querySelector('.nudge-val');
      const setNudge = (newVal) => {
        track.offsetMs = parseInt(newVal, 10) || 0;
        nudgeInput.value = track.offsetMs;
      };

      el.querySelector('.nudge-m50').addEventListener('click', ()=> setNudge(track.offsetMs - 50));
      el.querySelector('.nudge-m10').addEventListener('click', ()=> setNudge(track.offsetMs - 10));
      el.querySelector('.nudge-p10').addEventListener('click', ()=> setNudge(track.offsetMs + 10));
      el.querySelector('.nudge-p50').addEventListener('click', ()=> setNudge(track.offsetMs + 50));
      nudgeInput.addEventListener('change', (e)=> setNudge(e.target.value));

      trackListEl.appendChild(el);
      drawWaveform(track, `canvas-${track.id}`);
    });
    updateTrackDots();
  }

  function getPanLabel(v){
    if(Math.abs(v) < 0.05) return 'C';
    return (v < 0 ? 'E' : 'D') + Math.round(Math.abs(v)*100);
  }

  function updateTrackDots(){
    tracks.forEach(t => {
      const dot = document.getElementById(`dot-${t.id}`);
      if(dot) dot.className = `dot ${t.playing ? 'active' : ''}`;
    });
  }

  function drawWaveform(track, canvasId){
    const canvas = document.getElementById(canvasId);
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const buffer = track.buffer;
    const data = buffer.getChannelData(0);

    canvas.width = canvas.clientWidth * window.devicePixelRatio || 500;
    canvas.height = canvas.clientHeight * window.devicePixelRatio || 68;

    const width = canvas.width;
    const height = canvas.height;
    const step = Math.ceil(data.length / width);
    const amp = height / 2;

    ctx.fillStyle = '#12141a';
    ctx.fillRect(0, 0, width, height);
    ctx.fillStyle = '#4f8cff';

    for(let i = 0; i < width; i++){
      let min = 1.0, max = -1.0;
      for(let j = 0; j < step; j++){
        const datum = data[(i * step) + j];
        if(datum < min) min = datum;
        if(datum > max) max = datum;
      }
      ctx.fillRect(i, (1 + min) * amp, 1, Math.max(1, (max - min) * amp));
    }
  }

  // ---------- Salvar & Importar Projeto (.json) ----------
  saveProjBtn.addEventListener('click', async ()=>{
    if(tracks.length === 0){ setStatus('Nenhuma pista para salvar.', 2000); return; }
    setStatus('Gerando projeto...', null);

    const projectData = { version: 1, createdAt: new Date().toISOString(), tracks: [] };
    for(let t of tracks){
      const wavBlob = audioBufferToWav(t.buffer);
      const base64 = await blobToBase64(wavBlob);
      projectData.tracks.push({ name: t.name, volume: t.volume, pan: t.pan, offsetMs: t.offsetMs, audioBase64: base64 });
    }

    const jsonStr = JSON.stringify(projectData);
    const blob = new Blob([jsonStr], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `looper-projeto-${Date.now()}.json`; a.click();
    URL.revokeObjectURL(url);
    setStatus('Projeto salvo!', 2500);
  });

  loadProjBtn.addEventListener('click', ()=> projFileInput.click());
  projFileInput.addEventListener('change', async (e)=>{
    const file = e.target.files[0]; if(!file) return;
    await ensureAudioContext();
    setStatus('Carregando...', null);

    const reader = new FileReader();
    reader.onload = async (evt)=>{
      try{
        const proj = JSON.parse(evt.target.result);
        stopAllPlayback(); tracks = []; trackCounter = 0;
        for(let tData of proj.tracks){
          trackCounter++;
          const audioBuf = await base64ToAudioBuffer(tData.audioBase64);
          tracks.push({
            id: 'trk' + trackCounter, name: tData.name || ('Pista ' + trackCounter),
            buffer: audioBuf, volume: tData.volume ?? 1, pan: tData.pan ?? 0,
            offsetMs: tData.offsetMs ?? 0, muted: false, playing: false
          });
        }
        renderTracks(); setStatus('Projeto carregado!', 2500);
      }catch(err){ setStatus('Erro ao carregar projeto.', 3000); }
    };
    reader.readAsText(file); projFileInput.value = '';
  });

  function blobToBase64(blob){ return new Promise((resolve)=>{ const r = new FileReader(); r.onloadend = () => resolve(r.result); r.readAsDataURL(blob); }); }
  async function base64ToAudioBuffer(base64){ const res = await fetch(base64); const arrBuf = await res.arrayBuffer(); return await audioCtx.decodeAudioData(arrBuf); }

  // ---------- Mixagem Estéreo ----------
  exportBtn.addEventListener('click', ()=> mixdownAndExport(false));
  exportStemsBtn.addEventListener('click', ()=> mixdownAndExport(true));

  async function mixdownAndExport(stemsOnly){
    if(tracks.length === 0){ setStatus('Grave ao menos uma pista.', 2500); return; }
    setStatus('Mixando em estéreo...', null);

    const sampleRate = tracks[0].buffer.sampleRate;
    const totalDurationSec = calculateMaxDuration();
    const totalSamples = Math.ceil(totalDurationSec * sampleRate);

    if(!stemsOnly){
      const masterL = new Float32Array(totalSamples);
      const masterR = new Float32Array(totalSamples);

      tracks.forEach(t => {
        if(t.muted) return;
        const monoData = t.buffer.getChannelData(0);
        const offsetSamples = Math.round((t.offsetMs / 1000) * sampleRate);

        const panVal = t.pan || 0;
        const angle = (panVal + 1) * 0.25 * Math.PI;
        const gainL = Math.cos(angle) * t.volume;
        const gainR = Math.sin(angle) * t.volume;
        const phaseShiftR = (Math.abs(panVal) < 0.05) ? 1 : 0; 

        for(let i = 0; i < monoData.length; i++){
          const targetIdxL = i + offsetSamples;
          const targetIdxR = i + offsetSamples + phaseShiftR;
          const sample = monoData[i];

          if(targetIdxL >= 0 && targetIdxL < totalSamples) masterL[targetIdxL] += sample * gainL;
          if(targetIdxR >= 0 && targetIdxR < totalSamples) masterR[targetIdxR] += sample * gainR;
        }
      });

      const stereoBuffer = audioCtx.createBuffer(2, totalSamples, sampleRate);
      stereoBuffer.copyToChannel(masterL, 0); stereoBuffer.copyToChannel(masterR, 1);
      downloadWav(audioBufferToWav(stereoBuffer), `mixagem-estereo-${Date.now()}.wav`);
    } else {
      for(let t of tracks){ await exportSingleTrack(t); }
    }
    setStatus('Exportação concluída!', 2500);
  }

  async function exportSingleTrack(track){
    const sampleRate = track.buffer.sampleRate;
    const totalDurationSec = track.buffer.duration + Math.max(0, track.offsetMs/1000);
    const totalSamples = Math.ceil(totalDurationSec * sampleRate);

    const masterL = new Float32Array(totalSamples);
    const masterR = new Float32Array(totalSamples);
    const monoData = track.buffer.getChannelData(0);
    const offsetSamples = Math.round((track.offsetMs / 1000) * sampleRate);

    const panVal = track.pan || 0;
    const angle = (panVal + 1) * 0.25 * Math.PI;
    const gainL = Math.cos(angle) * track.volume;
    const gainR = Math.sin(angle) * track.volume;

    for(let i = 0; i < monoData.length; i++){
      const targetIdx = i + offsetSamples;
      if(targetIdx >= 0 && targetIdx < totalSamples){
        const sample = monoData[i];
        masterL[targetIdx] += sample * gainL;
        masterR[targetIdx] += sample * gainR;
      }
    }

    const stereoBuffer = audioCtx.createBuffer(2, totalSamples, sampleRate);
    stereoBuffer.copyToChannel(masterL, 0); stereoBuffer.copyToChannel(masterR, 1);
    downloadWav(audioBufferToWav(stereoBuffer), `${track.name.toLowerCase().replace(/\s+/g,'-')}.wav`);
  }

  function downloadWav(blob, filename){
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
    setTimeout(()=> URL.revokeObjectURL(url), 4000);
  }

  function audioBufferToWav(buffer){
    const numChannels = 2; const sampleRate = buffer.sampleRate;
    const numFrames = buffer.length; const bytesPerSample = 2; 
    const blockAlign = numChannels * bytesPerSample;
    const dataSize = numFrames * blockAlign;
    const arrBuf = new ArrayBuffer(44 + dataSize);
    const view = new DataView(arrBuf);

    function writeStr(offset, str){ for(let i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i)); }

    writeStr(0, 'RIFF'); view.setUint32(4, 36 + dataSize, true);
    writeStr(8, 'WAVE'); writeStr(12, 'fmt ');
    view.setUint32(16, 16, true); view.setUint16(20, 1, true);
    view.setUint16(22, numChannels, true); view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * blockAlign, true); view.setUint16(32, blockAlign, true);
    view.setUint16(34, bytesPerSample * 8, true); writeStr(36, 'data');
    view.setUint32(40, dataSize, true);

    const channelL = buffer.getChannelData(0);
    const channelR = buffer.getChannelData(1);

    let offset = 44;
    for(let i = 0; i < numFrames; i++){
      let sampleL = Math.max(-1, Math.min(1, channelL[i]));
      view.setInt16(offset, sampleL < 0 ? sampleL * 0x8000 : sampleL * 0x7fff, true);
      offset += 2;
      let sampleR = Math.max(-1, Math.min(1, channelR[i]));
      view.setInt16(offset, sampleR < 0 ? sampleR * 0x8000 : sampleR * 0x7fff, true);
      offset += 2;
    }
    return new Blob([arrBuf], {type:'audio/wav'});
  }

  // ---------- Calibração de Latência ----------
  offsetSlider.addEventListener('input', ()=>{
    latencyOffsetMs = parseInt(offsetSlider.value, 10);
    offsetVal.textContent = latencyOffsetMs + ' ms';
  });

  calBtn.addEventListener('click', async ()=>{
    calResult.textContent = 'Calibrando...';
    try{
      await ensureAudioContext(); await ensureMic();
      const clickTime = audioCtx.currentTime + 0.1;
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.frequency.value = 2000; gain.gain.setValueAtTime(0, clickTime);
      gain.gain.linearRampToValueAtTime(0.9, clickTime+0.005);
      gain.gain.linearRampToValueAtTime(0, clickTime+0.04);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(clickTime); osc.stop(clickTime+0.05);

      const dest = audioCtx.createMediaStreamDestination();
      const source = audioCtx.createMediaStreamSource(mediaStream);
      source.connect(dest);

      const rec = new MediaRecorder(dest.stream);
      const localChunks = [];
      rec.ondataavailable = e=>{ if(e.data.size>0) localChunks.push(e.data); };
      rec.start();

      await new Promise(r=>setTimeout(r, 600)); rec.stop();
      await new Promise(r=> rec.onstop = r);

      const blob = new Blob(localChunks, {type: localChunks[0]?.type || 'audio/webm'});
      const buf = await blob.arrayBuffer();
      const decoded = await audioCtx.decodeAudioData(buf);
      const data = decoded.getChannelData(0);

      let maxVal = 0, maxIdx = 0;
      for(let i=0; i<data.length; i++){ if(Math.abs(data[i]) > maxVal){ maxVal = Math.abs(data[i]); maxIdx = i; } }

      if(maxVal < 0.02){ calResult.textContent = 'Falha no pulso. Ajuste manual.'; return; }

      const detectedSec = maxIdx / decoded.sampleRate;
      const estimatedLatencyMs = Math.max(0, Math.round((detectedSec - 0.1) * 1000));
      latencyOffsetMs = Math.min(1000, Math.max(-1000, estimatedLatencyMs));
      offsetSlider.value = latencyOffsetMs; offsetVal.textContent = latencyOffsetMs + ' ms';
      calResult.textContent = `~${estimatedLatencyMs} ms.`;
    }catch(e){ calResult.textContent = 'Erro.'; }finally{ releaseMic(); }
  });

  renderTracks();
})();
</script>
</body>
</html>
